[project]
name = "resolve-mcp"
version = "0.1.0"
description = "Full-coverage MCP server for DaVinci Resolve Studio 21"
readme = "README.md"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE"]
classifiers = ["Programming Language :: Python :: 3.11", "Operating System :: OS Independent"]
keywords = ["mcp", "davinci", "resolve", "editorial", "color", "vfx"]
authors = [{ name = "Toolbox Design" }]
requires-python = ">=3.11"
dependencies = ["mcp[cli]>=2.3.0"]

[project.scripts]
resolve-mcp = "resolve_mcp:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.2.0", "pytest-asyncio>=1.4.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
